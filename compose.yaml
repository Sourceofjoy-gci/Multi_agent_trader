services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trading_house
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      TRADING_HOUSE_MIGRATION_PASSWORD: ${TRADING_HOUSE_MIGRATION_PASSWORD:?set TRADING_HOUSE_MIGRATION_PASSWORD}
      TRADING_HOUSE_RUNTIME_PASSWORD: ${TRADING_HOUSE_RUNTIME_PASSWORD:?set TRADING_HOUSE_RUNTIME_PASSWORD}
      # Phase 8A: the trial ledger gets its own database, DSN and migration
      # target, so it can be backed up and migrated on its own schedule. The
      # runtime role holds no write privilege at all on the two ledger tables
      # there; the same role does hold INSERT on the tables this phase inherits,
      # which is why the split is operational rather than a security boundary.
      TRADING_HOUSE_RESEARCH_DATABASE: ${TRADING_HOUSE_RESEARCH_DATABASE:-trading_house_research}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trading-house-postgres:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_house"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  trading-house-postgres:
