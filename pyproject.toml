[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-house"
version = "0.1.0"
description = "Safety-first foundation for an MT5 multi-agent trading house"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<52",
  "MetaTrader5>=5.0.45,<6 ; sys_platform == 'win32'",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "pyyaml>=6,<7",
  "rfc8785>=0.1,<1",
  "typer>=0.16,<1",
]

[project.scripts]
trading-house = "trading_house.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.16,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  # 4.15 is the first release that ships ``testcontainers.community``,
  # which ``tests/conftest.py`` imports. Probed, not guessed: 4.10.0
  # through 4.14.2 all raise ModuleNotFoundError on that import, so the
  # previous >=4.10 floor declared a range where the test suite could
  # not collect. The lock pins 4.15.0, so CI was unaffected and only a
  # fresh resolve would have found it.
  "testcontainers[postgres]>=4.15,<5",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_house"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib --cov=trading_house --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL",
  "mt5: requires a running MetaTrader 5 terminal",
]

[tool.coverage.run]
omit = ["src/trading_house/brokers/mt5/terminal.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Specifications and plans embed illustrative Python that is deliberately not
# formatted to this project's style. A Python formatter must not rewrite prose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["trading_house"]

[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true
